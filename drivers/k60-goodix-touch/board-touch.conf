# Redmi K60 (mondrian) touch — board configuration fragment.
#
# Source it before building a boot image, so the touch path is enabled with the
# one bypass this board can currently use:
#
#   cd ~/hackios/ios-sweet   (or the checkout that tools/k60-build-boot.sh uses)
#   . <repo>/drivers/k60-goodix-touch/board-touch.conf
#   tools/k60-build-boot.sh <kernel> artifacts/xnu-touch-id.img
#
# tools/k60-build-boot.sh appends K60_CMDLINE_EXTRA to its standard cmdline and
# prints it ("cmdline extra: ..."), so the args below can be seen in the build
# output before anything touches the phone.

# --- the bypass ---------------------------------------------------------------
# k60rpmhoff=1 is mandatory on this unit: the RSC block at 0x17a00000 is not
# reachable (XPU / power domain / interconnect, undecided — see 0248), and the
# first access takes the whole machine down with no panic. With the bypass the
# driver never maps RSC and never votes for pm8350c LDO C2; IOVDD is assumed to
# be left on by the bootloader. If the chip answers, that assumption is proven.
#
# Never combine k60rpmhoff=0 with k60rscprobe=1 on a live unit: the probe is the
# exact access that kills it. The driver refuses that combination by itself
# (0251), but do not rely on it.
K60_TOUCH_RPMHOFF=1

# --- stage ---------------------------------------------------------------------
# 4 = pins -> FPGA-free clock path -> SE4 as SPI -> Goodix ID readback, then stop.
# 5 would enter the poll loop and publish touches through SweetHIDTouch; that is
# deliberately not part of this verification.
K60_TOUCH_STAGE=4

# --- ID-only verification ------------------------------------------------------
# k60touchid=1 keeps the driver on the stage-4 path even if k60touchstage says 5,
# prints one machine-greppable "K60 TOUCH: ID:" summary and then exits the
# thread instead of polling.
K60_TOUCH_ID=1

# --- timing --------------------------------------------------------------------
# 8 s instead of the 20 s default: the log is already on disk by then and the
# touch thread does not need the GUI up (nothing is published at stage 4).
K60_TOUCH_DELAY=8

# --- SPI -----------------------------------------------------------------------
# 4 MHz. The SER divider is derived from the SE4 RCG parent, which the driver
# only decodes. 15 MHz (the panel overlay's spi-max-frequency) is the target
# once an ID read succeeds at 4 MHz.
K60_TOUCH_HZ=4000000

K60_CMDLINE_EXTRA="${K60_CMDLINE_EXTRA:-} k60touchstage=${K60_TOUCH_STAGE} k60rpmhoff=${K60_TOUCH_RPMHOFF} k60touchdelay=${K60_TOUCH_DELAY} k60touchhz=${K60_TOUCH_HZ}${K60_TOUCH_ID:+ k60touchid=${K60_TOUCH_ID}}"

# --- what the GPIO / clock / regulator numbers are -----------------------------
# reset GPIO20 (active low)  irq GPIO21 (open drain, pulled up)  avdd GPIO71
# SPI  GPIO16 clk / GPIO17 mosi / GPIO18 miso / GPIO19 cs0
# SE4  0x00990000 + 0x4000, GIC SPI 605 (not claimed, the driver polls)
# GCC  0x00100000 + 0x70000, votes at +0x62008 bits 6/7/8/9/14, RCG +0x274e4
# TLMM 0x0f100000, one 0x1000 page per pin
# IOVDD pm8350c LDO C2 ("ldoc2", rpmh-regulator-ldoc2), 1.8 V, LPM -> HPM (mode 7)
# AVDD  GPIO71, no second PMIC rail on this board (pong has ldoc3, K60 does not)
